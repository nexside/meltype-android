# SPDX-License-Identifier: GPL-3.0-or-later
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build image
        run: docker build --platform linux/amd64 -t meltype-build docker
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: build/bazel-cache
          key: bazel-${{ hashFiles('upstream/native/mozc/MOZC_COMMIT') }}
      - name: Core (NativeAOT)
        run: docker/run.sh core-native/build.sh
      - name: Mozc helper
        run: docker/run.sh env MOZC_BAZEL_FLAGS="--disk_cache=/work/build/bazel-cache ${MOZC_BAZEL_FLAGS:-}" mozc/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: |
            build/jniLibs
            build/notices

  app:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      # リリースの下書きを作るため
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: native
          path: build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # 既定の "tools" は SDK から消えていて失敗する
          packages: platform-tools
      - run: sdkmanager "ndk;27.1.12297006"
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${{ secrets.MELTYPE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"; exit "${PIPESTATUS[0]}"
      - name: Show compile errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |FAILED|What went wrong" -A2 "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: meltype-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build APK
        env:
          MELTYPE_KEYSTORE: ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/release.jks', runner.temp) || '' }}
          MELTYPE_KEYSTORE_PASSWORD: ${{ secrets.MELTYPE_KEYSTORE_PASSWORD }}
          MELTYPE_KEY_ALIAS: ${{ secrets.MELTYPE_KEY_ALIAS }}
          MELTYPE_KEY_PASSWORD: ${{ secrets.MELTYPE_KEY_PASSWORD }}
        run: |
          if [ -z "$MELTYPE_KEYSTORE" ]; then unset MELTYPE_KEYSTORE; fi
          ./gradlew :app:assembleRelease
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "meltype-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "meltype-${GITHUB_REF_NAME}.apk" THIRD-PARTY-NOTICES.md build/notices/* --draft --title "$GITHUB_REF_NAME"
